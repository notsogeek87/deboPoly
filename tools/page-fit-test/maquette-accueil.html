<!doctype html><html><head><meta charset="utf-8">

<!-- Structure relevée sur le vrai site : en-tête FIXE header#rootHeader ; menu (liens a.MenuItemLink-…) dont les
     dernières entrées passent SOUS les icônes chrono / dossier ; panneau latéral replié hors écran. -->
<style>body{margin:0;font-family:sans-serif}
#rootHeader{position:fixed;top:0;left:0;right:0;height:175px;background:#fff;z-index:5}
.head{display:flex;justify-content:center;align-items:center;gap:20px;height:75px;white-space:nowrap}
.logo{font-size:30px;font-weight:700}.search{width:140px;border:1px solid #ccc;padding:8px;overflow:hidden}.user{text-align:right}
.bottom{position:relative;height:90px;border-top:1px solid #ccc}
.menu{display:flex;white-space:nowrap}.menu a{padding:16px 12px;font-weight:600;color:#123;text-decoration:none}
.icons{position:absolute;right:0;top:0;display:flex;background:#fff}.icons span{width:42px;height:48px;border:1px solid #ccc}
main{padding-top:175px}.card{margin:20px;padding:20px;background:#38c;color:#fff}
.panel{position:fixed;top:0;right:-320px;width:320px;height:100%;background:#eee}</style>
</head><body class="Collaboration">
<header id="rootHeader"><div class="head"><span class="logo">PolyOffice</span><span class="search">Saisir 3 caractères minimum</span><span class="user">DEFRANCE Déborah<br>@CABINET-EXEMPLE</span></div>
<div class="bottom"><div class="menu"><a href="#">⌂</a><a href="#">DONNÉES</a><a href="#">AGENDA</a><a href="#">TÂCHES</a><a href="#">FINANCES</a><a href="#">ANALYSES</a></div>
<div class="icons"><span>⏱</span><span>📁</span></div></div></header>
<main><div class="card">Dossiers récents</div></main>
<div class="panel"><a href="#">Lien du panneau replié</a></div>
</body></html>
