<div class="main"><div id="scheduler"></div></div></div>
<script>
var d = new Date(); d.setHours(0,0,0,0); var day = 864e5;
function at(o,h,m){return new Date(d.getTime()+o*day+(h*60+m)*6e4);}
$("#scheduler").kendoScheduler({
  date: new Date(d.getTime() + 3*day), startTime: at(0,8,0), height: 700,
  group: { resources: ["Owner"] },
  resources: [{ field: "ownerId", name: "Owner", dataSource: [{ text: "MARTIN Paul", value: 1, color: "#5b9bd5" }] }],
  views: ["day", {type:"week", selected:true}, "month"],
  dataSource: [
    {title:"Audience TJ Paris – RG 24/0001", start:at(0,9,30), end:at(0,11,0), ownerId:1},
    {title:"RDV client – Société X", start:at(0,14,0), end:at(0,15,0), ownerId:1},
    {title:"Expertise judiciaire", start:at(1,10,0), end:at(1,12,0), ownerId:1},
    {title:"Délai conclusions", start:at(2,0,0), end:at(2,0,0), isAllDay:true, ownerId:1},
    {title:"Médiation", start:at(3,16,0), end:at(3,17,30), ownerId:1}
  ]
});
</script></body></html>
